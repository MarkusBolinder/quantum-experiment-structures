[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-experiment-structures"
version = "0.1.0"
description = "Module supporting representation and generation of quantum experiment structures."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Markus Bolinder", email = "mbolinder@ethz.ch" }
]
license = { text = "MIT" }

# runtime dependencies
dependencies = [
    "graphviz",
    "jsonschema",
    "numpy",
    "matplotlib",
    "pandas",
    "pyarrow>=15.0.0",
]


# development dependencies (installed with 'pip install .[dev]')
[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "flake8-black",
    "pyproject-flake8",
    "pyspark",
    "pytest",
    "pytest-cov",
]


[project.scripts]
ccs_generator = "quantum_experiment_structures.utils.ccs_generator_script:main"


# black configuration
[tool.black]
line-length = 100
target-version = ["py313"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.venv
  | venv
  | build
  | dist
  | \.eggs
)/
'''

[tool.setuptools.packages.find]
where = ["."]
exclude = ["unittests*", "examples*"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    ".eggs",
]

[tool.coverage.run]
omit = [
    "quantum_experiment_structures/__version__.py",
    "quantum_experiment_structures/data/*",
    "quantum_experiment_structures/utils/ccs_generator_script.py",
    "quantum_experiment_structures/utils/cluster_ccs_enumerator.py",
    "quantum_experiment_structures/utils/cluster_ccs_generator.py",
    "quantum_experiment_structures/utils/cluster_combiner.py",
    "quantum_experiment_structures/utils/compute_covers_cluster.py",
    "quantum_experiment_structures/utils/create_final_complete_dataset.py",
    "quantum_experiment_structures/utils/dynamically_repartition_and_sort_datasets.py",
    "quantum_experiment_structures/utils/dynamically_repartition_datasets.py",
    "quantum_experiment_structures/utils/full_analysis.py",
    "quantum_experiment_structures/utils/plotting_utils.py",
    "quantum_experiment_structures/utils/remove_equivalent_scenarios.py",
    "quantum_experiment_structures/utils/spark_utils.py",
]
